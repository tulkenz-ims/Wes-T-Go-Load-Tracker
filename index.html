<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2A4CB4">
<title>Wes-T-Go Load Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --blue: #2A4CB4;
    --blue-dark: #1E3785;
    --white: #FFFFFF;
    --black: #14161A;
    --gray: #6B7280;
    --gray-light: #E7E9EE;
    --gray-bg: #F4F5F8;
    --green: #1E7A32;
    --green-dark: #145223;
    --red: #C0392B;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--gray-bg);
    color: var(--black);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    overscroll-behavior: none;
  }
  #app { height: 100%; display: flex; flex-direction: column; }

  /* ---- Header ---- */
  header {
    background: var(--blue);
    color: var(--white);
    padding: 18px 20px calc(18px + var(--safe-top)) 20px;
    margin-top: calc(-1 * var(--safe-top));
    padding-top: calc(18px + var(--safe-top));
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 19px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  header .status {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .dot.offline { background: #F1C40F; }
  .dot.syncing { background: #F1C40F; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  main { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }

  /* ---- Big action button (home screen) ---- */
  .home { display: flex; flex-direction: column; gap: 16px; height: 100%; }
  .capture-btn {
    background: linear-gradient(rgba(42,76,180,0.72), rgba(30,55,133,0.82)), url('icon.png') center 30% / cover;
    color: var(--white);
    border: none;
    border-radius: var(--radius);
    padding: 40px 20px;
    font-family: inherit;
    font-size: 22px;
    font-weight: 800;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    flex: 1;
    min-height: 220px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .capture-btn:active { filter: brightness(0.85); }
  .capture-btn svg { width: 56px; height: 56px; }

  .secondary-row { display: flex; gap: 12px; }
  .secondary-btn {
    flex: 1;
    background: var(--white);
    border: 2px solid var(--gray-light);
    border-radius: var(--radius);
    padding: 18px 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--black);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .secondary-btn svg { width: 26px; height: 26px; color: var(--blue); }

  .pending-banner {
    background: #FFF7E6;
    border: 1px solid #F1C40F;
    color: #8A6D00;
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pending-banner button {
    background: var(--blue);
    color: var(--white);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
  }

  /* ---- Camera view ---- */
  .camera-view { position: fixed; inset: 0; background: #000; z-index: 50; display: flex; flex-direction: column; }
  .camera-view video { flex: 1 1 0; min-height: 0; width: 100%; object-fit: cover; }
  .camera-controls {
    background: #000;
    padding: 20px 24px calc(28px + var(--safe-bottom)) 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .shutter-btn {
    width: 74px; height: 74px; border-radius: 50%;
    background: var(--white); border: 5px solid rgba(255,255,255,0.4);
    cursor: pointer;
  }
  .cam-icon-btn {
    background: none; border: none; color: var(--white);
    width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .cam-icon-btn svg { width: 28px; height: 28px; }

  /* ---- Review / form screen ---- */
  .photo-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; }
  .photo-thumb {
    position: relative; flex-shrink: 0; width: 84px; height: 84px;
    border-radius: 10px; overflow: hidden; border: 2px solid var(--gray-light);
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-thumb .tag {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(20,22,26,0.75); color: var(--white);
    font-size: 9px; font-weight: 700; text-align: center; padding: 2px 0;
    text-transform: uppercase; letter-spacing: 0.03em;
    cursor: pointer;
  }
  .photo-thumb .remove {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: rgba(0,0,0,0.6); color: var(--white);
    display: flex; align-items: center; justify-content: center; font-size: 12px; border: none;
  }
  .add-photo-thumb {
    flex-shrink: 0; width: 84px; height: 84px; border-radius: 10px;
    border: 2px dashed var(--gray); display: flex; align-items: center; justify-content: center;
    background: var(--white); cursor: pointer; color: var(--gray);
  }
  .add-photo-thumb svg { width: 28px; height: 28px; }

  .photo-type-picker { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .photo-type-picker button {
    flex: 1; min-width: 90px;
    padding: 12px 8px; border-radius: 10px; border: 2px solid var(--gray-light);
    background: var(--white); font-family: inherit; font-weight: 700; font-size: 13px; color: var(--black);
  }
  .photo-type-picker button.active { border-color: var(--blue); background: #EEF1FB; color: var(--blue); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 700; color: var(--gray); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 14px; border-radius: 10px; border: 2px solid var(--gray-light);
    font-family: inherit; font-size: 16px; background: var(--white); color: var(--black);
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field .timestamp { font-size: 13px; color: var(--gray); font-weight: 600; }

  .save-btn {
    width: 100%; background: var(--green); color: var(--white); border: none;
    border-radius: var(--radius); padding: 18px; font-family: inherit; font-size: 17px; font-weight: 800;
    cursor: pointer; margin-top: 8px;
  }
  .save-btn:active { background: var(--green-dark); }
  .cancel-link {
    display: block; text-align: center; padding: 14px; color: var(--gray); font-weight: 600;
    font-size: 14px; background: none; border: none; width: 100%; font-family: inherit; cursor: pointer;
  }

  /* ---- Loads list / viewer ---- */
  .load-card {
    background: var(--white); border-radius: var(--radius); padding: 14px;
    margin-bottom: 12px; border: 1px solid var(--gray-light);
  }
  .load-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .load-card-title { font-weight: 800; font-size: 15px; }
  .load-card-date { font-size: 12px; color: var(--gray); font-weight: 600; }
  .load-card-meta { font-size: 13px; color: var(--gray); margin-bottom: 10px; }
  .load-card-photos { display: flex; gap: 8px; overflow-x: auto; }
  .load-card-photos img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; cursor: pointer; }
  .load-card-actions { display: flex; gap: 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gray-light); }
  .load-card-actions button {
    background: none; border: none; font-family: inherit; font-size: 13px; font-weight: 700;
    padding: 4px 0; cursor: pointer; display: flex; align-items: center; gap: 5px;
  }
  .load-card-actions button svg { width: 15px; height: 15px; }
  .edit-action { color: var(--blue); }
  .delete-action { color: var(--red); }

  /* ---- Photo viewer (tap to view full-size + download) ---- */
  .photo-viewer {
    position: fixed; inset: 0; background: rgba(20,22,26,0.96); z-index: 70;
    display: flex; flex-direction: column;
  }
  .photo-viewer-top {
    display: flex; justify-content: flex-end; padding: calc(16px + var(--safe-top)) 16px 12px 16px;
    flex-shrink: 0;
  }
  .photo-viewer-top button {
    background: rgba(255,255,255,0.15); border: none; color: var(--white);
    width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .photo-viewer-top button svg { width: 20px; height: 20px; }
  .photo-viewer-image { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 12px; }
  .photo-viewer-image img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
  .photo-viewer-bottom {
    padding: 16px 20px calc(24px + var(--safe-bottom)) 20px; flex-shrink: 0;
  }
  .download-btn {
    width: 100%; background: var(--blue); color: var(--white); border: none;
    border-radius: var(--radius); padding: 16px; font-family: inherit; font-size: 16px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  }
  .download-btn svg { width: 20px; height: 20px; }
  .download-btn:disabled { opacity: 0.6; }
  .viewer-btn-row { display: flex; gap: 10px; }
  .delete-photo-btn {
    background: var(--red); color: var(--white); border: none;
    border-radius: var(--radius); padding: 16px; font-family: inherit; font-size: 16px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    flex-shrink: 0; width: 56px;
  }
  .delete-photo-btn svg { width: 20px; height: 20px; }
  .sync-pill {
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px;
  }
  .sync-pill.pending { background: #FFF7E6; color: #8A6D00; }
  .sync-pill.synced { background: #E8F5EA; color: var(--green-dark); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--gray); }
  .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }

  /* ---- Bottom nav ---- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--white); border-top: 1px solid var(--gray-light);
    display: flex; padding-bottom: var(--safe-bottom);
    z-index: 10;
  }
  nav button {
    flex: 1; background: none; border: none; padding: 12px 0 10px 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--gray); font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer;
  }
  nav button.active { color: var(--blue); }
  nav button svg { width: 22px; height: 22px; }

  .toast {
    position: fixed; bottom: calc(80px + var(--safe-bottom)); left: 20px; right: 20px;
    background: var(--black); color: var(--white); padding: 14px 18px; border-radius: 10px;
    font-size: 14px; font-weight: 600; text-align: center; z-index: 60;
    opacity: 0; transform: translateY(10px); transition: all 0.25s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Wes-T-Go Loads</h1>
    <div class="status" id="statusPill">
      <span class="dot" id="statusDot"></span>

    </div>
  </header>
  <main id="main"></main>
  <nav>
    <button id="navHome" class="active" onclick="showScreen('home')">

    <button id="navLoads" onclick="showScreen('loads')">

      All Loads
    </button>

      Trash

</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIG — Supabase project credentials
   ========================================================= */
const SUPABASE_URL = 'https://ltdzvjibbajimftlmjhb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0ZHp2amliYmFqaW1mdGxtamhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NzY2NjAsImV4cCI6MjEwNTQ1MjY2MH0.phWnBHheoYtfxJMmGewMvhIzO4mGmuxjvGfwjuTrDdc';
const STORE_LOCATIONS = ["Alsup's", "Kent Quik", "Other"];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================
   INDEXEDDB — local offline storage
   ========================================================= */
const DB_NAME = 'wtg-loads-db';
const DB_VERSION = 1;
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('pendingLoads')) {
        d.createObjectStore('pendingLoads', { keyPath: 'localId' });
      }
      if (!d.objectStoreNames.contains('cachedLoads')) {
        d.createObjectStore('cachedLoads', { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e);
  });
}

function idbPut(storeName, value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(value);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

function idbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

function idbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

/* =========================================================
   STATE
   ========================================================= */
let currentScreen = 'home';
let cameraStream = null;
let draftPhotos = []; // { blob, type, url }
let activePhotoType = 'tlo';
let editContext = null; // { source: 'pending'|'remote', id, record }
let currentViewerDeleteCtx = null;

/* =========================================================
   UI HELPERS
   ========================================================= */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function updateStatusPill() {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  if (!navigator.onLine) {
    dot.className = 'dot offline';
    text.textContent = 'Offline';
  } else {
    dot.className = 'dot';
    text.textContent = 'Online';
  }
}

function showScreen(screen) {
  currentScreen = screen;
  document.getElementById('navHome').classList.toggle('active', screen === 'home');
  document.getElementById('navLoads').classList.toggle('active', screen === 'loads');
  document.getElementById('navTrash').classList.toggle('active', screen === 'trash');
  if (screen === 'home') renderHome();
  if (screen === 'loads') renderLoadsList();
  if (screen === 'trash') renderTrashScreen();
}

/* =========================================================
   HOME SCREEN
   ========================================================= */
async function renderHome() {
  const pending = await idbGetAll('pendingLoads');
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="home">
      ${pending.length > 0 ? `
        <div class="pending-banner">
          <span>${pending.length} load${pending.length > 1 ? 's' : ''} waiting to sync</span>
          <button onclick="trySync()">Sync now</button>
        </div>
      ` : ''}
      <button class="capture-btn" onclick="openCamera('tlo')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 011 1v11a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1z"/><circle cx="12" cy="13" r="4"/></svg>
        New Load — Take Photo
      </button>
      <div class="secondary-row">
        <button class="secondary-btn" onclick="triggerUpload('tlo')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
          Upload Photo
        </button>
        <button class="secondary-btn" onclick="showScreen('loads')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>
          View All Loads
        </button>
      </div>
    </div>
    <input type="file" id="fileUploadInput" accept="image/*" style="display:none" onchange="handleFileUpload(event)">
  `;
}

function triggerUpload(type) {
  activePhotoType = type;
  document.getElementById('fileUploadInput').click();
}

function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  draftPhotos.push({ blob: file, type: activePhotoType, url: URL.createObjectURL(file) });
  e.target.value = '';
  if (currentScreen === 'edit') renderEditScreen(); else renderReviewScreen();
}

/* =========================================================
   CAMERA
   ========================================================= */
async function openCamera(type) {
  activePhotoType = type;
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
  } catch (err) {
    showToast('Camera unavailable: ' + err.message);
    return;
  }

  const overlay = document.createElement('div');
  overlay.className = 'camera-view';
  overlay.id = 'cameraOverlay';
  overlay.innerHTML = `
    <video autoplay playsinline id="cameraVideo"></video>
    <div class="camera-controls">
      <button class="cam-icon-btn" onclick="closeCamera()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <button class="shutter-btn" onclick="capturePhoto()"></button>
      <div style="width:48px"></div>
    </div>
  `;
  document.body.appendChild(overlay);
  const video = document.getElementById('cameraVideo');
  video.srcObject = cameraStream;

  // Some Android browsers overlap the address bar over fixed-position content
  // when it re-appears after the camera starts. Force the overlay to track
  // the actual visible viewport height so the shutter button never gets hidden.
  function fitToVisualViewport() {
    if (window.visualViewport) {
      overlay.style.height = window.visualViewport.height + 'px';
    }
  }
  fitToVisualViewport();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitToVisualViewport);
    overlay._vvHandler = fitToVisualViewport;
  }
}

function closeCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  const overlay = document.getElementById('cameraOverlay');
  if (overlay) {
    if (overlay._vvHandler && window.visualViewport) {
      window.visualViewport.removeEventListener('resize', overlay._vvHandler);
    }
    overlay.remove();
  }
}

function capturePhoto() {
  const video = document.getElementById('cameraVideo');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob((blob) => {
    draftPhotos.push({ blob, type: activePhotoType, url: URL.createObjectURL(blob) });
    closeCamera();
    if (currentScreen === 'edit') renderEditScreen(); else renderReviewScreen();
  }, 'image/jpeg', 0.85);
}

/* =========================================================
   REVIEW / DETAILS SCREEN
   ========================================================= */
function renderReviewScreen() {
  currentScreen = 'review';
  const now = new Date();
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="field">
      <label>Photos</label>
      <div class="photo-strip" id="photoStrip"></div>
    </div>
    <div class="field">
      <label>Tag next photo as</label>
      <div class="photo-type-picker" id="typePicker">
        <button data-type="tlo" onclick="setActiveType('tlo')">TLO / Manifest</button>
        <button data-type="bol" onclick="setActiveType('bol')">Fuel BOL</button>
        <button data-type="other" onclick="setActiveType('other')">Other</button>
      </div>
    </div>

    <div class="field">
      <label>Captured</label>
      <div class="timestamp">${now.toLocaleString()}</div>
    </div>
    <div class="field">
      <label>Load # (optional)</label>
      <input type="text" id="fieldLoadNumber" inputmode="text" placeholder="e.g. 48213">
    </div>
    <div class="field">
      <label>Store / Location (optional)</label>
      <select id="fieldStore">
        <option value="">Select...</option>
        ${STORE_LOCATIONS.map(s => `<option value="${s}">${s}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Store # (optional)</label>
      <input type="text" id="fieldStoreNumber" inputmode="numeric" placeholder="e.g. 1042">
    </div>
    <div class="field">
      <label>Notes (optional)</label>
      <textarea id="fieldNotes" placeholder="Anything worth noting..."></textarea>
    </div>

    <button class="save-btn" onclick="saveLoad()">Save Load</button>
    <button class="cancel-link" onclick="discardDraft()">Discard</button>
  `;
  renderPhotoStrip();
  setActiveType(activePhotoType);
}

function setActiveType(type) {
  activePhotoType = type;
  document.querySelectorAll('#typePicker button').forEach(b => {
    b.classList.toggle('active', b.dataset.type === type);
  });
  // Also re-tag the most recently added new photo, so tapping a type
  // button visibly updates the photo you just took, not just future ones.
  if (draftPhotos.length > 0) {
    draftPhotos[draftPhotos.length - 1].type = type;
    if (currentScreen === 'edit') renderEditPhotoStrip();
    else renderPhotoStrip();
  }
}

function renderPhotoStrip() {
  const strip = document.getElementById('photoStrip');
  if (!strip) return;
  strip.innerHTML = draftPhotos.map((p, i) => `
    <div class="photo-thumb">
      <img src="${p.url}">
      <span class="tag">${p.type}</span>
      <button class="remove" onclick="removeDraftPhoto(${i})">&times;</button>
    </div>
  `).join('') + `
    <div class="add-photo-thumb" onclick="openCamera(activePhotoType)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </div>
  `;
}

function removeDraftPhoto(i) {
  draftPhotos.splice(i, 1);
  renderPhotoStrip();
}

function discardDraft() {
  draftPhotos = [];
  showScreen('home');
}

/* =========================================================
   SAVE LOAD (works fully offline)
   ========================================================= */
async function saveLoad() {
  if (draftPhotos.length === 0) {
    showToast('Add at least one photo first');
    return;
  }
  const localId = 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  const record = {
    localId,
    created_at: new Date().toISOString(),
    load_date: new Date().toISOString().slice(0, 10),
    load_number: document.getElementById('fieldLoadNumber').value || null,
    store_location: document.getElementById('fieldStore').value || null,
    store_number: document.getElementById('fieldStoreNumber').value || null,
    notes: document.getElementById('fieldNotes').value || null,
    photos: await Promise.all(draftPhotos.map(async p => ({
      type: p.type,
      blob: p.blob
    })))
  };
  await idbPut('pendingLoads', record);
  draftPhotos = [];
  showToast('Load saved on device');
  showScreen('home');
  trySync();
}

/* =========================================================
   SYNC — uploads pending loads to Supabase, then frees local storage
   ========================================================= */
let isSyncing = false;

async function trySync() {
  if (isSyncing || !navigator.onLine) return;
  const pending = await idbGetAll('pendingLoads');
  if (pending.length === 0) return;

  isSyncing = true;
  document.getElementById('statusDot').className = 'dot syncing';
  document.getElementById('statusText').textContent = 'Syncing...';

  for (const record of pending) {
    try {
      const { data: loadRow, error: loadErr } = await sb
        .from('loads')
        .insert({
          created_at: record.created_at,
          load_date: record.load_date,
          load_number: record.load_number,
          store_location: record.store_location,
          store_number: record.store_number,
          notes: record.notes
        })
        .select()
        .single();
      if (loadErr) throw loadErr;

      for (const photo of record.photos) {
        const path = `${loadRow.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
        const { error: upErr } = await sb.storage.from('load-photos').upload(path, photo.blob, {
          contentType: 'image/jpeg'
        });
        if (upErr) throw upErr;

        const { error: photoRowErr } = await sb.from('load_photos').insert({
          load_id: loadRow.id,
          photo_type: photo.type,
          storage_path: path
        });
        if (photoRowErr) throw photoRowErr;
      }

      // Success: remove from local pending queue — this is what frees phone storage
      await idbDelete('pendingLoads', record.localId);
    } catch (err) {
      console.error('Sync failed for', record.localId, err);
      // Leave it in the queue, retry next time
    }
  }

  isSyncing = false;
  updateStatusPill();
  if (currentScreen === 'home') renderHome();
  if (currentScreen === 'loads') renderLoadsList();
  showToast('Sync complete');
}

/* =========================================================
   PHOTO VIEWER — tap a thumbnail to see it full-size + download
   ========================================================= */
function openPhotoViewer(imageUrl, filename, deleteCtx) {
  currentViewerDeleteCtx = deleteCtx || null;
  const overlay = document.createElement('div');
  overlay.className = 'photo-viewer';
  overlay.id = 'photoViewerOverlay';
  overlay.innerHTML = `
    <div class="photo-viewer-top">
      <button onclick="closePhotoViewer()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="photo-viewer-image">
      <img src="${imageUrl}">
    </div>
    <div class="photo-viewer-bottom">
      <div class="viewer-btn-row">
        <button class="download-btn" id="downloadBtn" onclick="downloadPhoto('${imageUrl}', '${filename}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
          Download
        </button>
        ${deleteCtx ? `
        <button class="delete-photo-btn" onclick="deleteCurrentViewerPhoto()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
        </button>` : ''}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function closePhotoViewer() {
  const overlay = document.getElementById('photoViewerOverlay');
  if (overlay) overlay.remove();
  currentViewerDeleteCtx = null;
}

async function deleteCurrentViewerPhoto() {
  const ctx = currentViewerDeleteCtx;
  if (!ctx) return;
  if (!confirm('Move this photo to Trash? You can restore it later.')) return;

  try {
    if (ctx.kind === 'pending') {
      const all = await idbGetAll('pendingLoads');
      const record = all.find(r => r.localId === ctx.localId);
      if (record) {
        record.photos[ctx.photoIndex].deleted = true;
        record.photos[ctx.photoIndex].deletedAt = new Date().toISOString();
        await idbPut('pendingLoads', record);
      }
    } else if (ctx.kind === 'remote') {
      await sb.from('load_photos').update({ deleted_at: new Date().toISOString() }).eq('id', ctx.photoRowId);
    }
    showToast('Photo moved to Trash');
  } catch (err) {
    showToast('Delete failed: ' + err.message);
  }

  closePhotoViewer();
  if (currentScreen === 'edit') renderEditScreen();
  else if (currentScreen === 'loads') renderLoadsList();
}

async function downloadPhoto(imageUrl, filename) {
  const btn = document.getElementById('downloadBtn');
  btn.disabled = true;
  btn.textContent = 'Downloading...';
  try {
    const response = await fetch(imageUrl);
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename || 'photo.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
    showToast('Photo downloaded');
  } catch (err) {
    showToast('Download failed: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg> Download`;
  }
}

/* =========================================================
   LOADS LIST / VIEWER
   ========================================================= */
async function renderLoadsList() {
  const main = document.getElementById('main');
  main.innerHTML = `<div id="loadsContainer"><div class="empty-state">Loading...</div></div>`;

  const allPending = await idbGetAll('pendingLoads');
  const pending = allPending.filter(p => !p.deletedAt);
  let remoteLoads = [];
  let remotePhotosByLoad = {};

  if (navigator.onLine) {
    try {
      const { data: loads } = await sb.from('loads').select('*').is('deleted_at', null).order('created_at', { ascending: false }).limit(100);
      remoteLoads = loads || [];
      const { data: photos } = await sb.from('load_photos').select('*').is('deleted_at', null);
      (photos || []).forEach(p => {
        if (!remotePhotosByLoad[p.load_id]) remotePhotosByLoad[p.load_id] = [];
        remotePhotosByLoad[p.load_id].push(p);
      });
    } catch (err) {
      console.error('Failed to fetch loads', err);
    }
  }

  const container = document.getElementById('loadsContainer');
  if (pending.length === 0 && remoteLoads.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>
        <div>No loads yet</div>
      </div>
    `;
    return;
  }

  let html = '';
  window._viewerCtxRegistry = [];

  pending.forEach(p => {
    const thumbs = p.photos.map((ph, i) => {
      if (ph.deleted) return null;
      const url = URL.createObjectURL(ph.blob);
      const ctxIdx = window._viewerCtxRegistry.push({ kind: 'pending', localId: p.localId, photoIndex: i }) - 1;
      return `<img src="${url}" onclick="openPhotoViewer('${url}', '${(p.load_number || 'load')}-${ph.type}-${i}.jpg', window._viewerCtxRegistry[${ctxIdx}])">`;
    }).filter(Boolean).join('');
    html += `
      <div class="load-card">
        <div class="load-card-top">
          <div>
            <div class="load-card-title">${p.load_number ? 'Load #' + p.load_number : 'Load'}</div>
            <div class="load-card-date">${new Date(p.created_at).toLocaleString()}</div>
          </div>
          <span class="sync-pill pending">Pending sync</span>
        </div>
        <div class="load-card-meta">${[p.store_location, p.store_number, p.notes].filter(Boolean).join(' · ') || 'No notes'}</div>
        <div class="load-card-photos">${thumbs}</div>
        <div class="load-card-actions">
          <button class="edit-action" onclick="openEditLoad('pending', '${p.localId}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
            Edit
          </button>
          <button class="delete-action" onclick="deleteLoad('pending', '${p.localId}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
            Delete
          </button>
        </div>
      </div>
    `;
  });

  remoteLoads.forEach(l => {
    const photos = remotePhotosByLoad[l.id] || [];
    const thumbs = photos.map((ph, i) => {
      const { data } = sb.storage.from('load-photos').getPublicUrl(ph.storage_path);
      const ctxIdx = window._viewerCtxRegistry.push({ kind: 'remote', photoRowId: ph.id, storagePath: ph.storage_path }) - 1;
      return `<img src="${data.publicUrl}" onclick="openPhotoViewer('${data.publicUrl}', '${(l.load_number || 'load')}-${ph.photo_type}-${i}.jpg', window._viewerCtxRegistry[${ctxIdx}])">`;
    }).join('');
    html += `
      <div class="load-card">
        <div class="load-card-top">
          <div>
            <div class="load-card-title">${l.load_number ? 'Load #' + l.load_number : 'Load'}</div>
            <div class="load-card-date">${new Date(l.created_at).toLocaleString()}</div>
          </div>
          <span class="sync-pill synced">Synced</span>
        </div>
        <div class="load-card-meta">${[l.store_location, l.store_number, l.notes].filter(Boolean).join(' · ') || 'No notes'}</div>
        <div class="load-card-photos">${thumbs}</div>
        <div class="load-card-actions">
          <button class="edit-action" onclick="openEditLoad('remote', '${l.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
            Edit
          </button>
          <button class="delete-action" onclick="deleteLoad('remote', '${l.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
            Delete
          </button>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

/* =========================================================
   EDIT LOAD
   ========================================================= */
async function openEditLoad(source, id) {
  if (source === 'pending') {
    const all = await idbGetAll('pendingLoads');
    const record = all.find(r => r.localId === id);
    if (!record) { showToast('Load not found'); return; }
    editContext = { source: 'pending', id, record };
  } else {
    try {
      const { data: loadRow, error } = await sb.from('loads').select('*').eq('id', id).single();
      if (error) throw error;
      const { data: photos } = await sb.from('load_photos').select('*').eq('load_id', id).is('deleted_at', null);
      editContext = { source: 'remote', id, record: { ...loadRow, photos: photos || [] } };
    } catch (err) {
      showToast('Could not load: ' + err.message);
      return;
    }
  }
  draftPhotos = [];
  renderEditScreen();
}

function renderEditScreen() {
  currentScreen = 'edit';
  const { source, record } = editContext;
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="field">
      <label>Photos</label>
      <div class="photo-strip" id="photoStrip"></div>
    </div>
    <div class="field">
      <label>Tag next new photo as</label>
      <div class="photo-type-picker" id="typePicker">
        <button data-type="tlo" onclick="setActiveType('tlo')">TLO / Manifest</button>
        <button data-type="bol" onclick="setActiveType('bol')">Fuel BOL</button>
        <button data-type="other" onclick="setActiveType('other')">Other</button>
      </div>
    </div>
    <div class="field">
      <label>Load # (optional)</label>
      <input type="text" id="fieldLoadNumber" inputmode="text" value="${record.load_number || ''}">
    </div>
    <div class="field">
      <label>Store / Location (optional)</label>
      <select id="fieldStore">
        <option value="">Select...</option>
        ${STORE_LOCATIONS.map(s => `<option value="${s}" ${record.store_location === s ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Store # (optional)</label>
      <input type="text" id="fieldStoreNumber" inputmode="numeric" value="${record.store_number || ''}">
    </div>
    <div class="field">
      <label>Notes (optional)</label>
      <textarea id="fieldNotes" placeholder="Anything worth noting...">${record.notes || ''}</textarea>
    </div>

    <button class="save-btn" onclick="saveEditedLoad()">Save Changes</button>
    <button class="cancel-link" onclick="cancelEdit()">Cancel</button>
  `;
  renderEditPhotoStrip();
  setActiveType(activePhotoType);
}

function renderEditPhotoStrip() {
  const { source, record, id } = editContext;
  const strip = document.getElementById('photoStrip');
  if (!strip) return;

  window._viewerCtxRegistry = window._viewerCtxRegistry || [];

  let existingHtml = '';
  if (source === 'pending') {
    existingHtml = record.photos.map((p, i) => {
      if (p.deleted) return null;
      const url = URL.createObjectURL(p.blob);
      const ctxIdx = window._viewerCtxRegistry.push({ kind: 'pending', localId: id, photoIndex: i }) - 1;
      return `
        <div class="photo-thumb" onclick="openPhotoViewer('${url}', 'photo-${i}.jpg', window._viewerCtxRegistry[${ctxIdx}])">
          <img src="${url}">
          <span class="tag" onclick="event.stopPropagation(); cyclePhotoType('pending', '${id}', ${i})">${p.type}</span>
        </div>
      `;
    }).filter(Boolean).join('');
  } else {
    existingHtml = record.photos.map((p, i) => {
      const { data } = sb.storage.from('load-photos').getPublicUrl(p.storage_path);
      const ctxIdx = window._viewerCtxRegistry.push({ kind: 'remote', photoRowId: p.id, storagePath: p.storage_path }) - 1;
      return `
        <div class="photo-thumb" onclick="openPhotoViewer('${data.publicUrl}', 'photo-${i}.jpg', window._viewerCtxRegistry[${ctxIdx}])">
          <img src="${data.publicUrl}">
          <span class="tag" onclick="event.stopPropagation(); cyclePhotoType('remote', '${p.id}', ${i})">${p.photo_type}</span>
        </div>
      `;
    }).join('');
  }

  const draftHtml = draftPhotos.map((p, i) => `
    <div class="photo-thumb">
      <img src="${p.url}">
      <span class="tag">${p.type} · new</span>
      <button class="remove" onclick="removeDraftPhoto(${i})">&times;</button>
    </div>
  `).join('');

  strip.innerHTML = existingHtml + draftHtml + `
    <div class="add-photo-thumb" onclick="openCamera(activePhotoType)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </div>
  `;
}

async function cyclePhotoType(source, ref, index) {
  const order = ['tlo', 'bol', 'other'];

  if (source === 'pending') {
    const { record } = editContext;
    const current = record.photos[index].type;
    const next = order[(order.indexOf(current) + 1) % order.length];
    record.photos[index].type = next;
    await idbPut('pendingLoads', record);
  } else {
    const { record } = editContext;
    const photoRow = record.photos[index];
    const current = photoRow.photo_type;
    const next = order[(order.indexOf(current) + 1) % order.length];
    try {
      const { error } = await sb.from('load_photos').update({ photo_type: next }).eq('id', ref);
      if (error) throw error;
      photoRow.photo_type = next;
    } catch (err) {
      showToast('Update failed: ' + err.message);
      return;
    }
  }
  renderEditPhotoStrip();
}

function cancelEdit() {
  editContext = null;
  draftPhotos = [];
  showScreen('loads');
}

async function saveEditedLoad() {
  const { source, id, record } = editContext;
  const load_number = document.getElementById('fieldLoadNumber').value || null;
  const store_location = document.getElementById('fieldStore').value || null;
  const store_number = document.getElementById('fieldStoreNumber').value || null;
  const notes = document.getElementById('fieldNotes').value || null;

  try {
    if (source === 'pending') {
      record.load_number = load_number;
      record.store_location = store_location;
      record.store_number = store_number;
      record.notes = notes;
      record.photos = record.photos.concat(draftPhotos.map(p => ({ type: p.type, blob: p.blob })));
      await idbPut('pendingLoads', record);
    } else {
      const { error: updateErr } = await sb.from('loads').update({
        load_number, store_location, store_number, notes
      }).eq('id', id);
      if (updateErr) throw updateErr;

      for (const photo of draftPhotos) {
        const path = `${id}/${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
        const { error: upErr } = await sb.storage.from('load-photos').upload(path, photo.blob, {
          contentType: 'image/jpeg'
        });
        if (upErr) throw upErr;
        const { error: rowErr } = await sb.from('load_photos').insert({
          load_id: id, photo_type: photo.type, storage_path: path
        });
        if (rowErr) throw rowErr;
      }
    }
    showToast('Load updated');
  } catch (err) {
    showToast('Save failed: ' + err.message);
    return;
  }

  editContext = null;
  draftPhotos = [];
  showScreen('loads');
}

async function deleteLoad(source, id) {
  if (!confirm('Move this load to Trash? You can restore it later.')) return;

  try {
    if (source === 'pending') {
      const all = await idbGetAll('pendingLoads');
      const record = all.find(r => r.localId === id);
      if (record) {
        record.deletedAt = new Date().toISOString();
        await idbPut('pendingLoads', record);
      }
    } else {
      const { error } = await sb.from('loads').update({ deleted_at: new Date().toISOString() }).eq('id', id);
      if (error) throw error;
    }
    showToast('Load moved to Trash');
  } catch (err) {
    showToast('Delete failed: ' + err.message);
  }
  renderLoadsList();
}

/* =========================================================
   TRASH — restore or permanently remove soft-deleted items
   ========================================================= */
async function renderTrashScreen() {
  const main = document.getElementById('main');
  main.innerHTML = `<div class="empty-state">Loading...</div>`;

  const allPending = await idbGetAll('pendingLoads');
  const trashedPendingLoads = allPending.filter(p => p.deletedAt);
  const trashedPendingPhotos = [];
  allPending.filter(p => !p.deletedAt).forEach(p => {
    p.photos.forEach((ph, i) => {
      if (ph.deleted) trashedPendingPhotos.push({ record: p, photo: ph, index: i });
    });
  });

  let trashedRemoteLoads = [];
  let trashedRemotePhotos = [];
  if (navigator.onLine) {
    try {
      const { data: loads } = await sb.from('loads').select('*').not('deleted_at', 'is', null).order('deleted_at', { ascending: false });
      trashedRemoteLoads = loads || [];
      const { data: photos } = await sb.from('load_photos').select('*, loads(load_number, deleted_at)').not('deleted_at', 'is', null);
      trashedRemotePhotos = (photos || []).filter(p => !p.loads || !p.loads.deleted_at);
    } catch (err) {
      console.error('Failed to fetch trash', err);
    }
  }

  const totalCount = trashedPendingLoads.length + trashedPendingPhotos.length + trashedRemoteLoads.length + trashedRemotePhotos.length;
  if (totalCount === 0) {
    main.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
        <div>Trash is empty</div>
      </div>
    `;
    return;
  }

  let html = '';

  trashedPendingLoads.forEach(p => {
    html += `
      <div class="load-card">
        <div class="load-card-top">
          <div>
            <div class="load-card-title">${p.load_number ? 'Load #' + p.load_number : 'Load'}</div>
            <div class="load-card-date">Deleted ${new Date(p.deletedAt).toLocaleString()}</div>
          </div>
          <span class="sync-pill pending">Not synced</span>
        </div>
        <div class="load-card-actions">
          <button class="edit-action" onclick="restoreLoad('pending', '${p.localId}')">Restore</button>
          <button class="delete-action" onclick="permanentlyDeleteLoad('pending', '${p.localId}')">Delete Forever</button>
        </div>
      </div>
    `;
  });

  trashedRemoteLoads.forEach(l => {
    html += `
      <div class="load-card">
        <div class="load-card-top">
          <div>
            <div class="load-card-title">${l.load_number ? 'Load #' + l.load_number : 'Load'}</div>
            <div class="load-card-date">Deleted ${new Date(l.deleted_at).toLocaleString()}</div>
          </div>
          <span class="sync-pill synced">Synced</span>
        </div>
        <div class="load-card-actions">
          <button class="edit-action" onclick="restoreLoad('remote', '${l.id}')">Restore</button>
          <button class="delete-action" onclick="permanentlyDeleteLoad('remote', '${l.id}')">Delete Forever</button>
        </div>
      </div>
    `;
  });

  trashedPendingPhotos.forEach(({ record, photo, index }) => {
    const url = URL.createObjectURL(photo.blob);
    html += `
      <div class="load-card">
        <div class="load-card-top">
          <div>
            <div class="load-card-title">Photo from ${record.load_number ? 'Load #' + record.load_number : 'a load'}</div>
            <div class="load-card-date">Deleted ${new Date(photo.deletedAt).toLocaleString()}</div>
          </div>
        </div>
        <div class="load-card-photos"><img src="${url}"></div>
        <div class="load-card-actions">
          <button class="edit-action" onclick="restorePhoto('pending', '${record.localId}', ${index})">Restore</button>
          <button class="delete-action" onclick="permanentlyDeletePhoto('pending', '${record.localId}', ${index})">Delete Forever</button>
        </div>
      </div>
    `;
  });

  trashedRemotePhotos.forEach(ph => {
    const { data } = sb.storage.from('load-photos').getPublicUrl(ph.storage_path);
    html += `
      <div class="load-card">
        <div class="load-card-top">
          <div>
            <div class="load-card-title">Photo from ${ph.loads && ph.loads.load_number ? 'Load #' + ph.loads.load_number : 'a load'}</div>
            <div class="load-card-date">Deleted ${new Date(ph.deleted_at).toLocaleString()}</div>
          </div>
        </div>
        <div class="load-card-photos"><img src="${data.publicUrl}"></div>
        <div class="load-card-actions">
          <button class="edit-action" onclick="restorePhoto('remote', '${ph.id}')">Restore</button>
          <button class="delete-action" onclick="permanentlyDeletePhoto('remote', '${ph.id}', null, '${ph.storage_path}')">Delete Forever</button>
        </div>
      </div>
    `;
  });

  main.innerHTML = html;
}

async function restoreLoad(source, id) {
  try {
    if (source === 'pending') {
      const all = await idbGetAll('pendingLoads');
      const record = all.find(r => r.localId === id);
      if (record) {
        delete record.deletedAt;
        await idbPut('pendingLoads', record);
      }
    } else {
      await sb.from('loads').update({ deleted_at: null }).eq('id', id);
    }
    showToast('Load restored');
  } catch (err) {
    showToast('Restore failed: ' + err.message);
  }
  renderTrashScreen();
}

async function permanentlyDeleteLoad(source, id) {
  if (!confirm('Permanently delete this load? This cannot be undone.')) return;
  try {
    if (source === 'pending') {
      await idbDelete('pendingLoads', id);
    } else {
      const { data: photos } = await sb.from('load_photos').select('storage_path').eq('load_id', id);
      if (photos && photos.length > 0) {
        await sb.storage.from('load-photos').remove(photos.map(p => p.storage_path));
      }
      await sb.from('loads').delete().eq('id', id);
    }
    showToast('Load permanently deleted');
  } catch (err) {
    showToast('Delete failed: ' + err.message);
  }
  renderTrashScreen();
}

async function restorePhoto(source, refId, index) {
  try {
    if (source === 'pending') {
      const all = await idbGetAll('pendingLoads');
      const record = all.find(r => r.localId === refId);
      if (record) {
        delete record.photos[index].deleted;
        delete record.photos[index].deletedAt;
        await idbPut('pendingLoads', record);
      }
    } else {
      await sb.from('load_photos').update({ deleted_at: null }).eq('id', refId);
    }
    showToast('Photo restored');
  } catch (err) {
    showToast('Restore failed: ' + err.message);
  }
  renderTrashScreen();
}

async function permanentlyDeletePhoto(source, refId, index, storagePath) {
  if (!confirm('Permanently delete this photo? This cannot be undone.')) return;
  try {
    if (source === 'pending') {
      const all = await idbGetAll('pendingLoads');
      const record = all.find(r => r.localId === refId);
      if (record) {
        record.photos.splice(index, 1);
        await idbPut('pendingLoads', record);
      }
    } else {
      await sb.storage.from('load-photos').remove([storagePath]);
      await sb.from('load_photos').delete().eq('id', refId);
    }
    showToast('Photo permanently deleted');
  } catch (err) {
    showToast('Delete failed: ' + err.message);
  }
  renderTrashScreen();
}

window.addEventListener('online', () => { updateStatusPill(); trySync(); });
window.addEventListener('offline', updateStatusPill);

(async function init() {
  await openDB();
  updateStatusPill();
  renderHome();
  if (navigator.onLine) trySync();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err));
  }
})();
</script>
