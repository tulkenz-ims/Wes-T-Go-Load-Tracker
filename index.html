<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2A4CB4">
<title>WTG Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root {
    --blue: #2A4CB4;
    --blue-dark: #1E3785;
    --white: #FFFFFF;
    --black: #14161A;
    --gray: #6B7280;
    --gray-light: #E7E9EE;
    --gray-bg: #F4F5F8;
    --green: #1E7A32;
    --green-dark: #145223;
    --red: #C0392B;
    --offday-fill: #4C6FCE;
    --pto-fill: #C9791C;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--gray-bg);
    color: var(--black);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    overscroll-behavior: none;
  }
  #app { height: 100%; display: flex; flex-direction: column; }

  /* ---- Header ---- */
  header {
    background: var(--blue);
    color: var(--white);
    padding: 18px 20px calc(18px + var(--safe-top)) 20px;
    margin-top: calc(-1 * var(--safe-top));
    padding-top: calc(18px + var(--safe-top));
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 19px; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
  header .status {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .dot.offline { background: #F1C40F; }
  .dot.syncing { background: #F1C40F; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  main { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 116px; }

  /* ---- Big action button (home screen) ---- */
  .home { display: flex; flex-direction: column; gap: 16px; height: 100%; }
  .home-hero { position: relative; flex: 1; border-radius: var(--radius); overflow: hidden; background: var(--white); }
  .home-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-edit-badge {
    position: absolute; top: 12px; right: 12px; width: 52px; height: 52px;
    border-radius: 50%; background: rgba(20,22,26,0.55); border: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .cover-edit-badge svg { width: 26px; height: 26px; color: var(--white); }
  .home-actions-row { display: flex; gap: 12px; flex: 0 0 auto; }
  .action-btn {
    background: rgba(42,76,180,0.14);
    color: var(--blue-dark);
    border: 2px solid rgba(42,76,180,0.3);
    border-radius: var(--radius);
    padding: 14px 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    flex: 1;
    text-align: center;
  }
  .action-btn.upload-variant {
    background: var(--white);
    color: var(--black);
    border: 2px solid var(--gray-light);
  }
  .action-btn.upload-variant svg { color: var(--blue); }
  .action-btn:active { filter: brightness(0.95); }
  .action-btn svg { width: 22px; height: 22px; }

  .pending-banner {
    background: #FFF7E6;
    border: 1px solid #F1C40F;
    color: #8A6D00;
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pending-banner button {
    background: var(--blue);
    color: var(--white);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
  }

  /* ---- Camera view ---- */
  .camera-view { position: fixed; inset: 0; background: #000; z-index: 50; display: flex; flex-direction: column; }
  .camera-view video { flex: 1 1 0; min-height: 0; width: 100%; object-fit: cover; }
  .camera-controls {
    background: #000;
    padding: 20px 24px calc(28px + var(--safe-bottom)) 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .shutter-btn {
    width: 74px; height: 74px; border-radius: 50%;
    background: var(--white); border: 5px solid rgba(255,255,255,0.4);
    cursor: pointer;
  }
  .cam-icon-btn {
    background: none; border: none; color: var(--white);
    width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .cam-icon-btn svg { width: 28px; height: 28px; }

  /* ---- Review / form screen ---- */
  .photo-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; }
  .photo-thumb {
    position: relative; flex-shrink: 0; width: 84px; height: 84px;
    border-radius: 10px; overflow: hidden; border: 2px solid var(--gray-light);
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-thumb .tag {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(20,22,26,0.75); color: var(--white);
    font-size: 9px; font-weight: 700; text-align: center; padding: 2px 0;
    text-transform: uppercase; letter-spacing: 0.03em;
    cursor: pointer;
  }
  .photo-thumb .remove {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: rgba(0,0,0,0.6); color: var(--white);
    display: flex; align-items: center; justify-content: center; font-size: 12px; border: none;
  }
  .add-photo-thumb {
    flex-shrink: 0; width: 84px; height: 84px; border-radius: 10px;
    border: 2px dashed var(--gray); display: flex; align-items: center; justify-content: center;
    background: var(--white); cursor: pointer; color: var(--gray);
  }
  .add-photo-thumb svg { width: 28px; height: 28px; }

  .photo-type-picker { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .photo-type-picker button {
    flex: 1; min-width: 90px;
    padding: 12px 8px; border-radius: 10px; border: 2px solid var(--gray-light);
    background: var(--white); font-family: inherit; font-weight: 700; font-size: 13px; color: var(--black);
  }
  .photo-type-picker button.active { border-color: var(--blue); background: #EEF1FB; color: var(--blue); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 700; color: var(--gray); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 14px; border-radius: 10px; border: 2px solid var(--gray-light);
    font-family: inherit; font-size: 16px; background: var(--white); color: var(--black);
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field .timestamp { font-size: 13px; color: var(--gray); font-weight: 600; }

  .save-btn {
    width: 100%; background: var(--green); color: var(--white); border: none;
    border-radius: var(--radius); padding: 18px; font-family: inherit; font-size: 17px; font-weight: 800;
    cursor: pointer; margin-top: 8px;
  }
  .save-btn:active { background: var(--green-dark); }
  .cancel-link {
    display: block; text-align: center; padding: 14px; color: var(--gray); font-weight: 600;
    font-size: 14px; background: none; border: none; width: 100%; font-family: inherit; cursor: pointer;
  }

  /* ---- Loads list / viewer ---- */
  .load-card {
    background: var(--white); border-radius: var(--radius); padding: 14px;
    margin-bottom: 12px; border: 1px solid var(--gray-light);
  }
  .load-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .load-card-title { font-weight: 800; font-size: 15px; }
  .load-card-date { font-size: 12px; color: var(--gray); font-weight: 600; }
  .load-card-meta { font-size: 13px; color: var(--gray); margin-bottom: 10px; }
  .load-card-photos { display: flex; gap: 8px; overflow-x: auto; }
  .load-card-photos img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; cursor: pointer; }
  .list-thumb { position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .list-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
  .list-thumb .tag {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(20,22,26,0.75); color: var(--white);
    font-size: 8px; font-weight: 700; text-align: center; padding: 1px 0;
    text-transform: uppercase; letter-spacing: 0.02em; pointer-events: none;
  }
  .load-card-actions { display: flex; gap: 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gray-light); }
  .load-card-actions button {
    background: none; border: none; font-family: inherit; font-size: 13px; font-weight: 700;
    padding: 4px 0; cursor: pointer; display: flex; align-items: center; gap: 5px;
  }
  .load-card-actions button svg { width: 15px; height: 15px; }
  .edit-action { color: var(--blue); }
  .delete-action { color: var(--red); }

  /* ---- Photo viewer (tap to view full-size + download) ---- */
  .photo-viewer {
    position: fixed; inset: 0; background: rgba(20,22,26,0.96); z-index: 70;
    display: flex; flex-direction: column;
  }
  .photo-viewer-top {
    display: flex; justify-content: flex-end; padding: calc(16px + var(--safe-top)) 16px 12px 16px;
    flex-shrink: 0;
  }
  .photo-viewer-top button {
    background: rgba(255,255,255,0.15); border: none; color: var(--white);
    width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .photo-viewer-top button svg { width: 20px; height: 20px; }
  .photo-viewer-image { flex: 1 1 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 12px; }
  .photo-viewer-image img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
  .photo-viewer-bottom {
    padding: 16px 20px calc(24px + var(--safe-bottom)) 20px; flex-shrink: 0;
  }
  .download-btn {
    width: 100%; background: var(--blue); color: var(--white); border: none;
    border-radius: var(--radius); padding: 16px; font-family: inherit; font-size: 16px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  }
  .download-btn svg { width: 20px; height: 20px; }
  .download-btn:disabled { opacity: 0.6; }
  .viewer-btn-row { display: flex; gap: 10px; }
  .delete-photo-btn {
    background: var(--red); color: var(--white); border: none;
    border-radius: var(--radius); padding: 16px; font-family: inherit; font-size: 16px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    flex-shrink: 0; width: 56px;
  }
  .delete-photo-btn svg { width: 20px; height: 20px; }
  .share-photo-btn {
    background: var(--blue); color: var(--white); border: none;
    border-radius: var(--radius); padding: 16px; font-family: inherit; font-size: 16px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    flex-shrink: 0; width: 56px;
  }
  .share-photo-btn svg { width: 20px; height: 20px; }
  .sync-pill {
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px;
  }
  .sync-pill.pending { background: #FFF7E6; color: #8A6D00; }
  .sync-pill.synced { background: #E8F5EA; color: var(--green-dark); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--gray); }
  .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }

  /* ---- Bottom nav ---- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--white); border-top: 1px solid var(--gray-light);
    display: flex; padding-bottom: var(--safe-bottom);
    z-index: 10;
  }
  nav button {
    flex: 1; background: none; border: none; padding: 18px 0 16px 0;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    color: var(--gray); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  nav button.active { color: var(--blue); }
  nav button svg { width: 28px; height: 28px; }

  .toast {
    position: fixed; bottom: calc(96px + var(--safe-bottom)); left: 20px; right: 20px;
    background: var(--black); color: var(--white); padding: 14px 18px; border-radius: 10px;
    font-size: 14px; font-weight: 600; text-align: center; z-index: 60;
    opacity: 0; transform: translateY(10px); transition: all 0.25s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* ---- Schedule / calendar ---- */
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .print-cal-btn {
    background: var(--white); border: 2px solid var(--gray-light); border-radius: 10px;
    padding: 6px 10px; display: flex; align-items: center; gap: 5px; cursor: pointer;
    font-family: inherit; font-size: 11px; font-weight: 700; color: var(--blue);
  }
  .print-cal-btn svg { width: 14px; height: 14px; }
  .cal-actions-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .print-only { display: none; }

  @media print {
    header, nav, .print-cal-btn, .cal-header button, .add-pto-btn, .close-sheet-link, .toast,
    .day-sheet, #cameraOverlay, #photoViewerOverlay { display: none !important; }
    body { background: white; padding: 0; }
    main { padding: 0; overflow: visible; }
    .cal-legend { font-size: 10px; }
    .cal-day { border: 1px solid #999; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .print-only { display: block; margin-top: 24px; }
    .print-only h2 { font-size: 16px; margin-bottom: 12px; }
    .print-pto-entry { break-inside: avoid; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid #ccc; }
    .print-pto-entry .range { font-weight: 800; font-size: 13px; margin-bottom: 4px; }
    .print-pto-entry .notes { font-size: 12px; color: #444; margin-bottom: 8px; }
    .print-pto-entry img { max-width: 280px; max-height: 280px; display: block; }
  }
  .cal-header button {
    background: var(--white); border: 2px solid var(--gray-light); border-radius: 10px;
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .cal-header button svg { width: 16px; height: 16px; color: var(--blue); }
  .cal-header .cal-title { font-size: 15px; font-weight: 800; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; font-size: 10px; font-weight: 700; color: var(--gray); }
  .cal-legend span { display: flex; align-items: center; gap: 4px; }
  .cal-legend .dot { width: 8px; height: 8px; border-radius: 3px; display: inline-block; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 9px; font-weight: 800; color: var(--gray); padding-bottom: 2px; text-transform: uppercase; }
  .cal-day {
    aspect-ratio: 1 / 0.82; border-radius: 10px; background: var(--white); border: 1px solid var(--gray-light);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--black); cursor: pointer; position: relative; gap: 1px;
  }
  .cal-day-num { font-size: 14px; font-weight: 800; }
  .cal-day-label { font-size: 7px; font-weight: 800; letter-spacing: 0; white-space: nowrap; }
  .cal-day.empty { visibility: hidden; cursor: default; }
  .cal-day.off-day { background: rgba(76,111,206,0.3); border-color: rgba(76,111,206,0.5); color: var(--blue-dark); }
  .cal-day.pay-day { background: rgba(30,122,50,0.28); border-color: rgba(30,122,50,0.5); color: var(--green-dark); }
  .cal-day.pto-day { background: rgba(201,121,28,0.3); border-color: rgba(201,121,28,0.5); color: #8B4F10; }
  .cal-day.today { outline: 3px solid var(--black); outline-offset: -3px; }

  /* ---- Day detail sheet ---- */
  .day-sheet {
    position: fixed; inset: 0; background: rgba(20,22,26,0.5); z-index: 55;
    display: flex; align-items: flex-end;
  }
  .day-sheet-inner {
    background: var(--gray-bg); width: 100%; border-radius: 20px 20px 0 0;
    max-height: 85vh; overflow-y: auto; padding: 20px 20px calc(24px + var(--safe-bottom)) 20px;
  }
  .day-sheet-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .day-sheet-status { font-size: 14px; font-weight: 700; margin-bottom: 16px; }
  .day-sheet-status.off { color: var(--blue); }
  .day-sheet-status.work { color: var(--gray); }
  .day-sheet-status.pay { color: var(--green-dark); }
  .pto-card {
    background: var(--white); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; border: 1px solid var(--gray-light);
  }
  .pto-card-range { font-weight: 800; font-size: 14px; margin-bottom: 6px; }
  .pto-card-notes { font-size: 13px; color: var(--gray); margin-bottom: 10px; }
  .pto-card-photo { width: 100%; max-width: 200px; border-radius: 10px; cursor: pointer; margin-bottom: 10px; display: block; }
  .add-pto-btn {
    width: 100%; background: var(--blue); color: var(--white); border: none;
    border-radius: var(--radius); padding: 16px; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer;
  }
  .close-sheet-link {
    display: block; text-align: center; padding: 14px; color: var(--gray); font-weight: 600;
    font-size: 14px; background: none; border: none; width: 100%; font-family: inherit; cursor: pointer;
  }
  .pto-photo-upload {
    border: 2px dashed var(--gray); border-radius: 10px; padding: 24px; text-align: center;
    color: var(--gray); font-weight: 700; font-size: 13px; cursor: pointer; margin-bottom: 16px;
  }
  .pto-photo-upload img { max-width: 100%; max-height: 160px; border-radius: 8px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>WTG Tracker</h1>
    <div class="status" id="statusPill">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Online</span>
    </div>
  </header>
  <main id="main"></main>
  <nav>
    <button id="navHome" class="active" onclick="showScreen('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Home
    </button>
    <button id="navLoads" onclick="showScreen('loads')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>
      All Loads
    </button>
    <button id="navSchedule" onclick="showScreen('schedule')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      Schedule
    </button>
    <button id="navTrash" onclick="showScreen('trash')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
      Trash
    </button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONFIG — Supabase project credentials
   ========================================================= */
const SUPABASE_URL = 'https://ltdzvjibbajimftlmjhb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0ZHp2amliYmFqaW1mdGxtamhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4NzY2NjAsImV4cCI6MjEwNTQ1MjY2MH0.phWnBHheoYtfxJMmGewMvhIzO4mGmuxjvGfwjuTrDdc';
const STORE_LOCATIONS = ["Alsup's", "Kent Quik", "Other"];
const COVER_PHOTO_PATH = 'settings/cover.jpg'; // fixed path — uploading a new one overwrites it, shared across devices

// Work rotation: 6 days on, 2 days off. Anchor is the first day of a known off period.
const WORK_OFF_ANCHOR = '2026-09-14'; // first of two off-days
const WORK_CYCLE_LENGTH = 8; // 6 on + 2 off
const WORK_OFF_DAYS_IN_CYCLE = 2; // days 0 and 1 of each cycle are off

// Payday: every other Thursday. Anchor is a confirmed payday.
const PAYDAY_ANCHOR = '2026-09-10';
const PAYDAY_INTERVAL_DAYS = 14;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================
   INDEXEDDB — local offline storage
   ========================================================= */
const DB_NAME = 'wtg-loads-db';
const DB_VERSION = 1;
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('pendingLoads')) {
        d.createObjectStore('pendingLoads', { keyPath: 'localId' });
      }
      if (!d.objectStoreNames.contains('cachedLoads')) {
        d.createObjectStore('cachedLoads', { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e);
  });
}

function idbPut(storeName, value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).put(value);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

function idbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    tx.objectStore(storeName).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

function idbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function updateStatusPill() {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  if (!navigator.onLine) {
    dot.className = 'dot offline';
    text.textContent = 'Offline';
  } else {
    dot.className = 'dot';
    text.textContent = 'Online';
  }
}

function showScreen(screen) {
  currentScreen = screen;
  document.getElementById('navHome').classList.toggle('active', screen === 'home');
  document.getElementById('navLoads').classList.toggle('active', screen === 'loads');
  document.getElementById('navTrash').classList.toggle('active', screen === 'trash');
  document.getElementById('navSchedule').classList.toggle('active', screen === 'schedule');
  if (screen === 'home') renderHome();
  if (screen === 'loads') renderLoadsList();
  if (screen === 'trash') renderTrashScreen();

/* =========================================================
   CAMERA
   ========================================================= */
async function openCamera(type) {
  activePhotoType = type;
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
  } catch (err) {
    showToast('Camera unavailable: ' + err.message);
    return;
  }

  const overlay = document.createElement('div');
  overlay.className = 'camera-view';
  overlay.id = 'cameraOverlay';
  overlay.innerHTML = `
    <video autoplay playsinline id="cameraVideo"></video>
    <div class="camera-controls">
      <button class="cam-icon-btn" onclick="closeCamera()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <button class="shutter-btn" onclick="capturePhoto()"></button>
      <div style="width:48px"></div>
    </div>
  `;
  document.body.appendChild(overlay);
  const video = document.getElementById('cameraVideo');
  video.srcObject = cameraStream;

  // Some Android browsers overlap the address bar over fixed-position content
  // when it re-appears after the camera starts. Force the overlay to track
  // the actual visible viewport height so the shutter button never gets hidden.
  function fitToVisualViewport() {
    if (window.visualViewport) {
      overlay.style.height = window.visualViewport.height + 'px';
    }
  }
  fitToVisualViewport();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitToVisualViewport);
    overlay._vvHandler = fitToVisualViewport;
  }
}

function closeCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  const overlay = document.getElementById('cameraOverlay');
  if (overlay) {
    if (overlay._vvHandler && window.visualViewport) {
      window.visualViewport.removeEventListener('resize', overlay._vvHandler);
    }
    overlay.remove();
  }
}

function capturePhoto() {
  const video = document.getElementById('cameraVideo');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob((blob) => {
    draftPhotos.push({ blob, type: activePhotoType, url: URL.createObjectURL(blob) });
    closeCamera();
    if (currentScreen === 'edit') renderEditScreen(); else renderReviewScreen();
  }, 'image/jpeg', 0.85);
}

/* =========================================================
   SAVE LOAD (works fully offline)
   ========================================================= */
async function saveLoad() {
  if (draftPhotos.length === 0) {
    showToast('Add at least one photo first');
    return;
  }
  const localId = 'local-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  const record = {
    localId,
    created_at: new Date().toISOString(),
    load_date: new Date().toISOString().slice(0, 10),
    load_number: document.getElementById('fieldLoadNumber').value || null,
    store_location: document.getElementById('fieldStore').value || null,
    store_number: document.getElementById('fieldStoreNumber').value || null,
    notes: document.getElementById('fieldNotes').value || null,
    photos: await Promise.all(draftPhotos.map(async p => ({
      type: p.type,
      blob: p.blob
    })))
  };
  await idbPut('pendingLoads', record);
  draftPhotos = [];
  showToast('Load saved on device');
  showScreen('home');
  trySync();
}

/* =========================================================
   SYNC — uploads pending loads to Supabase, then frees local storage
   ========================================================= */
let isSyncing = false;

async function trySync() {
  if (isSyncing || !navigator.onLine) return;
  const pending = await idbGetAll('pendingLoads');
  if (pending.length === 0) return;

  isSyncing = true;
  document.getElementById('statusDot').className = 'dot syncing';
  document.getElementById('statusText').textContent = 'Syncing...';

  for (const record of pending) {
    try {
      const { data: loadRow, error: loadErr } = await sb
        .from('loads')
        .insert({
          created_at: record.created_at,
          load_date: record.load_date,
          load_number: record.load_number,
          store_location: record.store_location,
          store_number: record.store_number,
          notes: record.notes
        })
        .select()
        .single();
      if (loadErr) throw loadErr;

      for (const photo of record.photos) {
        const path = `${loadRow.id}/${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
        const { error: upErr } = await sb.storage.from('load-photos').upload(path, photo.blob, {
          contentType: 'image/jpeg'
        });
        if (upErr) throw upErr;

        const { error: photoRowErr } = await sb.from('load_photos').insert({
          load_id: loadRow.id,
          photo_type: photo.type,
          storage_path: path
        });
        if (photoRowErr) throw photoRowErr;
      }

      // Success: remove from local pending queue — this is what frees phone storage
      await idbDelete('pendingLoads', record.localId);
    } catch (err) {
      console.error('Sync failed for', record.localId, err);
      // Leave it in the queue, retry next time
    }
  }

  isSyncing = false;
  updateStatusPill();
  if (currentScreen === 'home') renderHome();
  if (currentScreen === 'loads') renderLoadsList();
  showToast('Sync complete');
}

async function deleteCurrentViewerPhoto() {
  const ctx = currentViewerDeleteCtx;
  if (!ctx) return;
  if (!confirm('Move this photo to Trash? You can restore it later.')) return;

  try {
    if (ctx.kind === 'pending') {
      const all = await idbGetAll('pendingLoads');
      const record = all.find(r => r.localId === ctx.localId);
      if (record) {
        record.photos[ctx.photoIndex].deleted = true;
        record.photos[ctx.photoIndex].deletedAt = new Date().toISOString();
        await idbPut('pendingLoads', record);
      }
    } else if (ctx.kind === 'remote') {
      await sb.from('load_photos').update({ deleted_at: new Date().toISOString() }).eq('id', ctx.photoRowId);
    }
    showToast('Photo moved to Trash');
  } catch (err) {
    showToast('Delete failed: ' + err.message);
  }

  closePhotoViewer();
  if (currentScreen === 'edit') renderEditScreen();
  else if (currentScreen === 'loads') renderLoadsList();
}

async function sharePhoto(imageUrl, filename) {
  const btn = document.getElementById('shareBtn');
  try {
    const response = await fetch(imageUrl);
    const blob = await response.blob();
    const file = new File([blob], filename || 'photo.jpg', { type: blob.type || 'image/jpeg' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: 'WTG Tracker photo'
      });
    } else if (navigator.share) {
      // Some browsers support share() but not file sharing — fall back to a link share
      await navigator.share({ title: 'WTG Tracker photo', url: imageUrl });
    } else {
      showToast('Sharing not supported on this browser — use Download instead');
    }
  } catch (err) {
    // AbortError just means the user cancelled the share sheet — not a real error
    if (err.name !== 'AbortError') {
      showToast('Share failed: ' + err.message);
    }
  }
}

/* =========================================================
   LOAD-LEVEL SHARE — photos only, details only, or everything
   ========================================================= */
async function getLoadFullData(source, id) {
  if (source === 'pending') {
    const all = await idbGetAll('pendingLoads');
    const record = all.find(r => r.localId === id);
    if (!record) return null;
    return {
      load_number: record.load_number,
      store_location: record.store_location,
      store_number: record.store_number,
      notes: record.notes,
      created_at: record.created_at,
      photos: record.photos.filter(p => !p.deleted).map(p => ({ type: p.type, blob: p.blob }))
    };
  } else {
    const { data: loadRow } = await sb.from('loads').select('*').eq('id', id).single();
    const { data: photoRows } = await sb.from('load_photos').select('*').eq('load_id', id).is('deleted_at', null);
    const photos = [];
    for (const ph of (photoRows || [])) {
      const { data } = sb.storage.from('load-photos').getPublicUrl(ph.storage_path);
      const resp = await fetch(data.publicUrl);
      const blob = await resp.blob();
      photos.push({ type: ph.photo_type, blob });
    }
    return {
      load_number: loadRow.load_number,
      store_location: loadRow.store_location,
      store_number: loadRow.store_number,
      notes: loadRow.notes,
      created_at: loadRow.created_at,
      photos
    };
  }
}

function loadDetailsText(data) {
  const lines = [
    `WTG Tracker — ${data.load_number ? 'Load #' + data.load_number : 'Load'}`,
    new Date(data.created_at).toLocaleString()
  ];
  const metaLine = [data.store_location, data.store_number].filter(Boolean).join(' #');
  if (metaLine) lines.push(metaLine);
  if (data.notes) lines.push('Notes: ' + data.notes);
  return lines.join('\n');
}

async function shareLoadPhotosOnly(source, id) {
  closeLoadShareMenu();
  const data = await getLoadFullData(source, id);
  if (!data || data.photos.length === 0) { showToast('No photos to share'); return; }
  try {
    const files = data.photos.map((p, i) => new File([p.blob], `${data.load_number || 'load'}-${p.type}-${i}.jpg`, { type: p.blob.type || 'image/jpeg' }));
    if (navigator.canShare && navigator.canShare({ files })) {
      await navigator.share({ files, title: 'WTG Tracker photos' });
    } else {
      showToast('Sharing multiple photos isn\'t supported on this browser — try one at a time');
    }
  } catch (err) {
    if (err.name !== 'AbortError') showToast('Share failed: ' + err.message);
  }
}

async function shareLoadDetailsOnly(source, id) {
  closeLoadShareMenu();
  const data = await getLoadFullData(source, id);
  if (!data) { showToast('Load not found'); return; }
  const text = loadDetailsText(data);
  try {
    if (navigator.share) {
      await navigator.share({ title: 'WTG Tracker Load Details', text });
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(text);
      showToast('Details copied to clipboard');
    } else {
      showToast('Sharing not supported on this browser');
    }
  } catch (err) {
    if (err.name !== 'AbortError') showToast('Share failed: ' + err.message);
  }
}

async function shareLoadEverything(source, id) {
  closeLoadShareMenu();
  const data = await getLoadFullData(source, id);
  if (!data) { showToast('Load not found'); return; }
  const text = loadDetailsText(data);
  try {
    const files = data.photos.map((p, i) => new File([p.blob], `${data.load_number || 'load'}-${p.type}-${i}.jpg`, { type: p.blob.type || 'image/jpeg' }));
    if (files.length > 0 && navigator.canShare && navigator.canShare({ files })) {
      await navigator.share({ files, title: 'WTG Tracker Load', text });
    } else if (navigator.share) {
      await navigator.share({ title: 'WTG Tracker Load', text });
    } else {
      showToast('Sharing not supported on this browser');
    }
  } catch (err) {
    if (err.name !== 'AbortError') showToast('Share failed: ' + err.message);
  }
}

async function downloadPhoto(imageUrl, filename) {
  const btn = document.getElementById('downloadBtn');
  btn.disabled = true;
  btn.textContent = 'Downloading...';
  try {
    const response = await fetch(imageUrl);
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename || 'photo.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
    showToast('Photo downloaded');
  } catch (err) {
    showToast('Download failed: ' + err.message);
  } finally {
    btn.disabled = false;

/* =========================================================
   EDIT LOAD
   ========================================================= */
async function openEditLoad(source, id) {
  if (source === 'pending') {
    const all = await idbGetAll('pendingLoads');
    const record = all.find(r => r.localId === id);
    if (!record) { showToast('Load not found'); return; }
    editContext = { source: 'pending', id, record };
  } else {
    try {
      const { data: loadRow, error } = await sb.from('loads').select('*').eq('id', id).single();
      if (error) throw error;
      const { data: photos } = await sb.from('load_photos').select('*').eq('load_id', id).is('deleted_at', null);
      editContext = { source: 'remote', id, record: { ...loadRow, photos: photos || [] } };
    } catch (err) {
      showToast('Could not load: ' + err.message);
      return;
    }
  }
  draftPhotos = [];
  renderEditScreen();
}

function renderEditScreen() {
  currentScreen = 'edit';
  const { source, record } = editContext;
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="field">

function renderEditPhotoStrip() {
  const { source, record, id } = editContext;
  const strip = document.getElementById('photoStrip');
  if (!strip) return;

  window._viewerCtxRegistry = window._viewerCtxRegistry || [];

  let existingHtml = '';
  if (source === 'pending') {
    existingHtml = record.photos.map((p, i) => {
      if (p.deleted) return null;
      const url = URL.createObjectURL(p.blob);
      const ctxIdx = window._viewerCtxRegistry.push({ kind: 'pending', localId: id, photoIndex: i }) - 1;
      return `
        <div class="photo-thumb" onclick="openPhotoViewer('${url}', 'photo-${i}.jpg', window._viewerCtxRegistry[${ctxIdx}])">
          <img src="${url}">
          <span class="tag" onclick="event.stopPropagation(); cyclePhotoType('pending', '${id}', ${i})">${p.type}</span>
        </div>
      `;
    }).filter(Boolean).join('');
  } else {
    existingHtml = record.photos.map((p, i) => {
      const { data } = sb.storage.from('load-photos').getPublicUrl(p.storage_path);
      const ctxIdx = window._viewerCtxRegistry.push({ kind: 'remote', photoRowId: p.id, storagePath: p.storage_path }) - 1;
      return `
        <div class="photo-thumb" onclick="openPhotoViewer('${data.publicUrl}', 'photo-${i}.jpg', window._viewerCtxRegistry[${ctxIdx}])">
          <img src="${data.publicUrl}">
          <span class="tag" onclick="event.stopPropagation(); cyclePhotoType('remote', '${p.id}', ${i})">${p.photo_type}</span>
        </div>
      `;
    }).join('');
  }

  const draftHtml = draftPhotos.map((p, i) => `
    <div class="photo-thumb">
      <img src="${p.url}">
      <span class="tag">${p.type} · new</span>
      <button class="remove" onclick="removeDraftPhoto(${i})">&times;</button>
    </div>
  `).join('');

  strip.innerHTML = existingHtml + draftHtml + `
    <div class="add-photo-thumb" onclick="openCamera(activePhotoType)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </div>
  `;
}

async function cyclePhotoType(source, ref, index) {
  const order = ['tlo', 'bol', 'other'];

  if (source === 'pending') {
    const { record } = editContext;
    const current = record.photos[index].type;
    const next = order[(order.indexOf(current) + 1) % order.length];
    record.photos[index].type = next;
    await idbPut('pendingLoads', record);
  } else {
    const { record } = editContext;
    const photoRow = record.photos[index];
    const current = photoRow.photo_type;
    const next = order[(order.indexOf(current) + 1) % order.length];
    try {
      const { error } = await sb.from('load_photos').update({ photo_type: next }).eq('id', ref);
      if (error) throw error;
      photoRow.photo_type = next;
    } catch (err) {
      showToast('Update failed: ' + err.message);
      return;
    }
  }
  renderEditPhotoStrip();
}

function cancelEdit() {
  editContext = null;
  draftPhotos = [];
  showScreen('loads');
}

async function saveEditedLoad() {
  const { source, id, record } = editContext;
  const load_number = document.getElementById('fieldLoadNumber').value || null;
  const store_location = document.getElementById('fieldStore').value || null;
  const store_number = document.getElementById('fieldStoreNumber').value || null;
  const notes = document.getElementById('fieldNotes').value || null;

  try {
    if (source === 'pending') {
      record.load_number = load_number;
      record.store_location = store_location;
      record.store_number = store_number;
      record.notes = notes;
      record.photos = record.photos.concat(draftPhotos.map(p => ({ type: p.type, blob: p.blob })));
      await idbPut('pendingLoads', record);
    } else {
      const { error: updateErr } = await sb.from('loads').update({
        load_number, store_location, store_number, notes
      }).eq('id', id);
      if (updateErr) throw updateErr;

      for (const photo of draftPhotos) {
        const path = `${id}/${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
        const { error: upErr } = await sb.storage.from('load-photos').upload(path, photo.blob, {
          contentType: 'image/jpeg'
        });
        if (upErr) throw upErr;
        const { error: rowErr } = await sb.from('load_photos').insert({
          load_id: id, photo_type: photo.type, storage_path: path
        });
        if (rowErr) throw rowErr;
      }
    }
    showToast('Load updated');
  } catch (err) {
    showToast('Save failed: ' + err.message);
    return;
  }

  editContext = null;
  draftPhotos = [];
  showScreen('loads');
}

async function deleteLoad(source, id) {
  if (!confirm('Move this load to Trash? You can restore it later.')) return;

  try {
    if (source === 'pending') {
      const all = await idbGetAll('pendingLoads');
      const record = all.find(r => r.localId === id);
      if (record) {
        record.deletedAt = new Date().toISOString();
        await idbPut('pendingLoads', record);
      }
    } else {
      const { error } = await sb.from('loads').update({ deleted_at: new Date().toISOString() }).eq('id', id);
      if (error) throw error;
    }
    showToast('Load moved to Trash');
  } catch (err) {
    showToast('Delete failed: ' + err.message);
  }
  renderLoadsList();
}

/* =========================================================
   TRASH — restore or permanently remove soft-deleted items
   ========================================================= */
async function renderTrashScreen() {
  const main = document.getElementById('main');
  main.innerHTML = `<div class="empty-state">Loading...</div>`;

  const allPending = await idbGetAll('pendingLoads');
  const trashedPendingLoads = allPending.filter(p => p.deletedAt);
  const trashedPendingPhotos = [];
  allPending.filter(p => !p.deletedAt).forEach(p => {
    p.photos.forEach((ph, i) => {
      if (ph.deleted) trashedPendingPhotos.push({ record: p, photo: ph, index: i });
    });
  });

  let trashedRemoteLoads = [];
  let trashedRemotePhotos = [];
  let trashedPto = [];
  if (navigator.onLine) {
    try {
      const { data: loads } = await sb.from('loads').select('*').not('deleted_at', 'is', null).order('deleted_at', { ascending: false });
      trashedRemoteLoads = loads || [];
      const { data: photos } = await sb.from('load_photos').select('*, loads(load_number, deleted_at)').not('deleted_at', 'is', null);
      trashedRemotePhotos = (photos || []).filter(p => !p.loads || !p.loads.deleted_at);
      const { data: pto } = await sb.from('pto_entries').select('*').not('deleted_at', 'is', null).order('deleted_at', { ascending: false });
      trashedPto = pto || [];
    } catch (err) {
      console.error('Failed to fetch trash', err);
    }
  }

  const totalCount = trashedPendingLoads.length + trashedPendingPhotos.length + trashedRemoteLoads.length + trashedRemotePhotos.length + trashedPto.length;
  if (totalCount === 0) {
    main.innerHTML = `
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
        <div>Trash is empty</div>
      </div>
    `;
    return;
  }

  let html = '';

  trashedPendingLoads.forEach(p => {
    html += `
      <div class="load-card">
        <div class="load-card-top">
          <div>
            <div class="load-card-title">${p.load_number ? 'Load #' + p.load_number : 'Load'}</div>
            <div class="load-card-date">Deleted ${new Date(p.deletedAt).toLocaleString()}</div>
          </div>
          <span class="sync-pill pending">Not synced</span>
        </div>
        <div class="load-card-actions">
          <button class="edit-action" onclick="restoreLoad('pending', '${p.localId}')">Restore</button>
          <button class="delete-action" onclick="permanentlyDeleteLoad('pending', '${p.localId}')">Delete Forever</button>
        </div>
      </div>
    `;
  });

  trashedRemoteLoads.forEach(l => {
    html += `
      <div class="load-card">
        <div class="load-card-top">
          <div>
            <div class="load-card-title">${l.load_number ? 'Load #' + l.load_number : 'Load'}</div>
            <div class="load-card-date">Deleted ${new Date(l.deleted_at).toLocaleString()}</div>
          </div>
          <span class="sync-pill synced">Synced</span>
        </div>
        <div class="load-card-actions">
          <button class="edit-action" onclick="restoreLoad('remote', '${l.id}')">Restore</button>
          <button class="delete-action" onclick="permanentlyDeleteLoad('remote', '${l.id}')">Delete Forever</button>
        </div>
      </div>
    `;
  });

  trashedPendingPhotos.forEach(({ record, photo, index }) => {
    const url = URL.createObjectURL(photo.blob);
    html += `
      <div class="load-card">
        <div class="load-card-top">
          <div>
            <div class="load-card-title">Photo from ${record.load_number ? 'Load #' + record.load_number : 'a load'}</div>
            <div class="load-card-date">Deleted ${new Date(photo.deletedAt).toLocaleString()}</div>
          </div>
        </div>
        <div class="load-card-photos"><img src="${url}"></div>
        <div class="load-card-actions">
          <button class="edit-action" onclick="restorePhoto('pending', '${record.localId}', ${index})">Restore</button>
          <button class="delete-action" onclick="permanentlyDeletePhoto('pending', '${record.localId}', ${index})">Delete Forever</button>
        </div>
      </div>
    `;
  });

  trashedRemotePhotos.forEach(ph => {
    const { data } = sb.storage.from('load-photos').getPublicUrl(ph.storage_path);
    html += `
      <div class="load-card">
        <div class="load-card-top">
          <div>
            <div class="load-card-title">Photo from ${ph.loads && ph.loads.load_number ? 'Load #' + ph.loads.load_number : 'a load'}</div>
            <div class="load-card-date">Deleted ${new Date(ph.deleted_at).toLocaleString()}</div>

async function restoreLoad(source, id) {
  try {
    if (source === 'pending') {
      const all = await idbGetAll('pendingLoads');
      const record = all.find(r => r.localId === id);
      if (record) {
        delete record.deletedAt;
        await idbPut('pendingLoads', record);
      }
    } else {
      await sb.from('loads').update({ deleted_at: null }).eq('id', id);
    }
    showToast('Load restored');
  } catch (err) {
    showToast('Restore failed: ' + err.message);
  }
  renderTrashScreen();
}

async function permanentlyDeleteLoad(source, id) {
  if (!confirm('Permanently delete this load? This cannot be undone.')) return;
  try {
    if (source === 'pending') {
      await idbDelete('pendingLoads', id);
    } else {
      const { data: photos } = await sb.from('load_photos').select('storage_path').eq('load_id', id);
      if (photos && photos.length > 0) {
        await sb.storage.from('load-photos').remove(photos.map(p => p.storage_path));
      }
      await sb.from('loads').delete().eq('id', id);
    }
    showToast('Load permanently deleted');
  } catch (err) {
    showToast('Delete failed: ' + err.message);
  }
  renderTrashScreen();
}

async function restorePhoto(source, refId, index) {
  try {
    if (source === 'pending') {
      const all = await idbGetAll('pendingLoads');
      const record = all.find(r => r.localId === refId);
      if (record) {
        delete record.photos[index].deleted;
        delete record.photos[index].deletedAt;
        await idbPut('pendingLoads', record);
      }
    } else {
      await sb.from('load_photos').update({ deleted_at: null }).eq('id', refId);
    }
    showToast('Photo restored');
  } catch (err) {
    showToast('Restore failed: ' + err.message);
  }
  renderTrashScreen();
}

async function permanentlyDeletePhoto(source, refId, index, storagePath) {
  if (!confirm('Permanently delete this photo? This cannot be undone.')) return;
  try {
    if (source === 'pending') {
      const all = await idbGetAll('pendingLoads');
      const record = all.find(r => r.localId === refId);
      if (record) {
        record.photos.splice(index, 1);
        await idbPut('pendingLoads', record);
      }
    } else {
      await sb.storage.from('load-photos').remove([storagePath]);
      await sb.from('load_photos').delete().eq('id', refId);
    }
    showToast('Photo permanently deleted');
  } catch (err) {
    showToast('Delete failed: ' + err.message);
  }
  renderTrashScreen();
}

/* =========================================================
   SCHEDULE — work/off rotation, payday, and PTO calendar
   ========================================================= */
function dateToKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function keyToDate(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function daysBetween(fromKey, toDate) {
  const from = keyToDate(fromKey);
  const fromUTC = Date.UTC(from.getFullYear(), from.getMonth(), from.getDate());
  const toUTC = Date.UTC(toDate.getFullYear(), toDate.getMonth(), toDate.getDate());
  return Math.floor((toUTC - fromUTC) / 86400000);
}

function isOffDay(date) {
  const diff = daysBetween(WORK_OFF_ANCHOR, date);
  const cyclePos = ((diff % WORK_CYCLE_LENGTH) + WORK_CYCLE_LENGTH) % WORK_CYCLE_LENGTH;
  return cyclePos < WORK_OFF_DAYS_IN_CYCLE;
}

function isPayday(date) {
  const diff = daysBetween(PAYDAY_ANCHOR, date);
  const cyclePos = ((diff % PAYDAY_INTERVAL_DAYS) + PAYDAY_INTERVAL_DAYS) % PAYDAY_INTERVAL_DAYS;
  return cyclePos === 0;
}

let _ptoCache = []; // loaded once per schedule screen render

async function renderScheduleScreen() {
  currentScreen = 'schedule';
  const main = document.getElementById('main');
  main.innerHTML = `<div class="empty-state">Loading...</div>`;

  if (navigator.onLine) {
    try {
      const { data } = await sb.from('pto_entries').select('*').is('deleted_at', null).order('start_date');
      _ptoCache = data || [];
    } catch (err) {
      console.error('Failed to load PTO', err);
      _ptoCache = [];
    }
  }

  renderCalendarGrid();
}

function ptoForDate(dateKey) {
  return _ptoCache.filter(p => dateKey >= p.start_date && dateKey <= p.end_date);
}

function renderCalendarGrid() {
  const main = document.getElementById('main');
  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();
  const monthName = calendarViewDate.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayKey = dateToKey(new Date());

  let cells = '';
  for (let i = 0; i < startWeekday; i++) {
    cells += `<div class="cal-day empty"></div>`;
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const d = new Date(year, month, day);
    const key = dateToKey(d);
    const off = isOffDay(d);
    const pay = isPayday(d);
    const pto = ptoForDate(key).length > 0;
    const classes = ['cal-day'];
    if (key === todayKey) classes.push('today');

    let inlineStyle = '';
    let label = '';
    if (pto && pay) {
      // PTO already means "not working" — combine with payday, no need to also show the plain off-day color
      inlineStyle = `style="background: linear-gradient(135deg, rgba(201,121,28,0.35) 50%, rgba(30,122,50,0.35) 50%); color: var(--black);"`;
      label = 'PTO/PAY';
    } else if (pto) {
      classes.push('pto-day');
      label = 'PTO';
    } else if (off && pay) {
      inlineStyle = `style="background: linear-gradient(135deg, rgba(76,111,206,0.35) 50%, rgba(30,122,50,0.35) 50%); color: var(--black);"`;
      label = 'OFF/PAY';
    } else if (off) {
      classes.push('off-day');
      label = 'OFF';
    } else if (pay) {
      classes.push('pay-day');
      label = 'PAY';
    }

    cells += `
      <div class="${classes.join(' ')}" ${inlineStyle} onclick="openDaySheet('${key}')">
        <span class="cal-day-num">${day}</span>
        ${label ? `<span class="cal-day-label">${label}</span>` : ''}
      </div>
    `;
  }

  const dowLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  const monthStartKey = dateToKey(new Date(year, month, 1));
  const monthEndKey = dateToKey(new Date(year, month + 1, 0));
  const monthPto = _ptoCache.filter(p => p.start_date <= monthEndKey && p.end_date >= monthStartKey);

  const printAppendixHtml = monthPto.length > 0 ? `
    <div class="print-only">
      <h2>PTO — ${monthName}</h2>
      ${monthPto.map(p => {
        const rangeLabel = p.start_date === p.end_date
          ? keyToDate(p.start_date).toLocaleDateString()
          : `${keyToDate(p.start_date).toLocaleDateString()} – ${keyToDate(p.end_date).toLocaleDateString()}`;
        let photoImg = '';
        if (p.confirmation_photo_path) {
          const { data } = sb.storage.from('load-photos').getPublicUrl(p.confirmation_photo_path);
          photoImg = `<img src="${data.publicUrl}">`;
        }
        return `
          <div class="print-pto-entry">
            <div class="range">${rangeLabel}</div>
            ${p.notes ? `<div class="notes">${p.notes}</div>` : ''}
            ${photoImg}
          </div>
        `;
      }).join('')}
    </div>
  ` : '';

  main.innerHTML = `
    <div class="cal-actions-row">
      <button class="print-cal-btn" onclick="downloadCalendarPdf()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>
        Download PDF
      </button>
      <button class="print-cal-btn" onclick="shareCalendarPdf()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
        Share PDF
      </button>
    </div>
    <div id="calPrintSection">
      <div class="cal-header">
        <button onclick="changeMonth(-1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="cal-title">${monthName}</div>
        <button onclick="changeMonth(1)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <div class="cal-legend">
        <span><span class="dot" style="background:var(--offday-fill)"></span> Off day</span>
        <span><span class="dot" style="background:var(--green)"></span> Payday</span>
        <span><span class="dot" style="background:var(--pto-fill)"></span> PTO</span>
      </div>
      <div class="cal-grid">
        ${dowLabels.map(l => `<div class="cal-dow">${l}</div>`).join('')}
        ${cells}
      </div>
    </div>
    ${printAppendixHtml}
  `;
}

function changeMonth(delta) {
  calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth() + delta, 1);
  renderCalendarGrid();
}

/* =========================================================
   CALENDAR PDF — works the same way on iPhone and Android
   ========================================================= */
async function buildCalendarPdfBlob() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 30;
  const usableWidth = pageWidth - margin * 2;
  const usableHeight = pageHeight - margin * 2;

  const calSection = document.getElementById('calPrintSection');
  const canvas1 = await html2canvas(calSection, { backgroundColor: '#ffffff', scale: 2, useCORS: true });
  const imgData1 = canvas1.toDataURL('image/png');
  const imgHeight1 = Math.min(canvas1.height * (usableWidth / canvas1.width), usableHeight);
  doc.addImage(imgData1, 'PNG', margin, margin, usableWidth, imgHeight1);

  const appendix = document.querySelector('.print-only');
  if (appendix) {
    const prevDisplay = appendix.style.display;
    appendix.style.display = 'block';
    const canvas2 = await html2canvas(appendix, { backgroundColor: '#ffffff', scale: 2, useCORS: true });
    appendix.style.display = prevDisplay;

    const imgData2 = canvas2.toDataURL('image/png');
    const fullImgHeight = canvas2.height * (usableWidth / canvas2.width);

    // Paginate the appendix across as many pages as needed, since PTO photos can run long
    let renderedHeight = 0;
    while (renderedHeight < fullImgHeight) {
      doc.addPage();
      const sliceHeight = Math.min(usableHeight, fullImgHeight - renderedHeight);
      doc.addImage(
        imgData2, 'PNG',
        margin, margin - renderedHeight,
        usableWidth, fullImgHeight
      );
      renderedHeight += sliceHeight;
    }
  }

  return doc.output('blob');
}

async function downloadCalendarPdf() {
  showToast('Building PDF...');
  try {
    const blob = await buildCalendarPdfBlob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `WTG-Schedule-${calendarViewDate.getFullYear()}-${calendarViewDate.getMonth() + 1}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    showToast('PDF downloaded');
  } catch (err) {
    showToast('PDF failed: ' + err.message);
  }
}

async function shareCalendarPdf() {
  showToast('Building PDF...');
  try {
    const blob = await buildCalendarPdfBlob();
    const filename = `WTG-Schedule-${calendarViewDate.getFullYear()}-${calendarViewDate.getMonth() + 1}.pdf`;
    const file = new File([blob], filename, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'WTG Tracker Schedule' });
    } else {
      showToast('Sharing not supported here — try Download PDF instead');
    }
  } catch (err) {
    if (err.name !== 'AbortError') showToast('Share failed: ' + err.message);
  }
}

function openDaySheet(dateKey) {
  const d = keyToDate(dateKey);
  const off = isOffDay(d);
  const pay = isPayday(d);
  const ptoEntries = ptoForDate(dateKey);
  const dayLabel = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

  let statusHtml = `<div class="day-sheet-status ${off ? 'off' : 'work'}">${off ? 'Off day' : 'Work day'}</div>`;
  if (pay) statusHtml += `<div class="day-sheet-status pay">💵 Payday</div>`;

  const ptoCards = ptoEntries.map(p => {
    let photoHtml = '';
    if (p.confirmation_photo_path) {
      const { data } = sb.storage.from('load-photos').getPublicUrl(p.confirmation_photo_path);
      photoHtml = `<img class="pto-card-photo" src="${data.publicUrl}" onclick="openPhotoViewer('${data.publicUrl}', 'pto-confirmation.jpg')">`;
    }
    const rangeLabel = p.start_date === p.end_date
      ? keyToDate(p.start_date).toLocaleDateString()
      : `${keyToDate(p.start_date).toLocaleDateString()} – ${keyToDate(p.end_date).toLocaleDateString()}`;
    return `
      <div class="pto-card">
        <div class="pto-card-range">PTO: ${rangeLabel}</div>
        ${p.notes ? `<div class="pto-card-notes">${p.notes}</div>` : ''}
        ${photoHtml}
        <div class="load-card-actions">
          <button class="edit-action" onclick="openPtoEditor('${p.id}')">Edit</button>
          <button class="delete-action" onclick="deletePto('${p.id}')">Delete</button>
        </div>
      </div>
    `;
  }).join('');

  const overlay = document.createElement('div');
  overlay.className = 'day-sheet';
  overlay.id = 'daySheetOverlay';
  overlay.innerHTML = `
    <div class="day-sheet-inner">
      <div class="day-sheet-title">${dayLabel}</div>
      ${statusHtml}
      ${ptoCards}
      <button class="add-pto-btn" onclick="openPtoEditor(null, '${dateKey}')">+ Add PTO starting this day</button>
      <button class="close-sheet-link" onclick="closeDaySheet()">Close</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

function closeDaySheet() {
  const overlay = document.getElementById('daySheetOverlay');
  if (overlay) overlay.remove();
}

/* =========================================================
   PTO EDITOR
   ========================================================= */
function openPtoEditor(ptoId, defaultDateKey) {
  closeDaySheet();
  if (ptoId) {
    const existing = _ptoCache.find(p => p.id === ptoId);
    ptoEditContext = {
      id: ptoId,
      start_date: existing.start_date,
      end_date: existing.end_date,
      notes: existing.notes || '',
      existingPhotoPath: existing.confirmation_photo_path,
      newPhotoBlob: null,
      removeExistingPhoto: false
    };
  } else {
    ptoEditContext = {
      id: null,
      start_date: defaultDateKey,
      end_date: defaultDateKey,
      notes: '',
      existingPhotoPath: null,
      newPhotoBlob: null,
      removeExistingPhoto: false
    };
  }
  renderPtoEditorSheet();
}

function renderPtoEditorSheet() {
  const ctx = ptoEditContext;
  let photoAreaHtml;
  if (ctx.newPhotoBlob) {
    photoAreaHtml = `<div class="pto-photo-upload" onclick="triggerPtoPhotoUpload()"><img src="${URL.createObjectURL(ctx.newPhotoBlob)}"></div>`;
  } else if (ctx.existingPhotoPath && !ctx.removeExistingPhoto) {
    const { data } = sb.storage.from('load-photos').getPublicUrl(ctx.existingPhotoPath);
    photoAreaHtml = `<div class="pto-photo-upload" onclick="triggerPtoPhotoUpload()"><img src="${data.publicUrl}"></div>`;
  } else {
    photoAreaHtml = `<div class="pto-photo-upload" onclick="triggerPtoPhotoUpload()">Tap to attach confirmation (screenshot, email, etc.)</div>`;
  }

  const overlay = document.createElement('div');
  overlay.className = 'day-sheet';
  overlay.id = 'ptoEditorOverlay';
  overlay.innerHTML = `
    <div class="day-sheet-inner">
      <div class="day-sheet-title">${ctx.id ? 'Edit PTO' : 'Add PTO'}</div>
      <div class="field">
        <label>Start date</label>
        <input type="date" id="ptoStartDate" value="${ctx.start_date}">
      </div>
      <div class="field">
        <label>End date</label>
        <input type="date" id="ptoEndDate" value="${ctx.end_date}">
      </div>
      <div class="field">
        <label>Notes (optional)</label>
        <textarea id="ptoNotes" placeholder="Anything worth noting...">${ctx.notes}</textarea>
      </div>
      <div class="field">
        <label>Confirmation photo (optional)</label>
        ${photoAreaHtml}
      </div>
      <button class="save-btn" onclick="savePto()">Save PTO</button>
      <button class="cancel-link" onclick="closePtoEditor()">Cancel</button>
    </div>
    <input type="file" id="ptoPhotoInput" accept="image/*" style="display:none" onchange="handlePtoPhotoSelected(event)">
  `;
  document.body.appendChild(overlay);
}

function triggerPtoPhotoUpload() {
  document.getElementById('ptoPhotoInput').click();
}

function handlePtoPhotoSelected(e) {
  const file = e.target.files[0];
  if (!file) return;
  ptoEditContext.newPhotoBlob = file;
  ptoEditContext.removeExistingPhoto = false;
  renderPtoEditorSheetInPlace();
}

function renderPtoEditorSheetInPlace() {
  // preserve in-progress field values while swapping the photo preview
  const startVal = document.getElementById('ptoStartDate')?.value;
  const endVal = document.getElementById('ptoEndDate')?.value;
  const notesVal = document.getElementById('ptoNotes')?.value;
  if (startVal) ptoEditContext.start_date = startVal;
  if (endVal) ptoEditContext.end_date = endVal;
  if (notesVal !== undefined) ptoEditContext.notes = notesVal;
  closePtoEditor();
  renderPtoEditorSheet();
}

function closePtoEditor() {
  const overlay = document.getElementById('ptoEditorOverlay');
  if (overlay) overlay.remove();
}

async function savePto() {
  const start_date = document.getElementById('ptoStartDate').value;
  const end_date = document.getElementById('ptoEndDate').value;
  const notes = document.getElementById('ptoNotes').value || null;

  if (!start_date || !end_date) {
    showToast('Start and end dates are required');
    return;
  }
  if (end_date < start_date) {
    showToast('End date must be on or after start date');
    return;
  }

  const ctx = ptoEditContext;
  try {
    let photoPath = ctx.existingPhotoPath;
    if (ctx.removeExistingPhoto) photoPath = null;

    if (ctx.newPhotoBlob) {
      const path = `pto/${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
      const { error: upErr } = await sb.storage.from('load-photos').upload(path, ctx.newPhotoBlob, {
        contentType: ctx.newPhotoBlob.type || 'image/jpeg'
      });
      if (upErr) throw upErr;
      photoPath = path;
    }

    if (ctx.id) {
      const { error } = await sb.from('pto_entries').update({
        start_date, end_date, notes, confirmation_photo_path: photoPath
      }).eq('id', ctx.id);
      if (error) throw error;
    } else {
      const { error } = await sb.from('pto_entries').insert({
        start_date, end_date, notes, confirmation_photo_path: photoPath
      });
      if (error) throw error;
    }
    showToast('PTO saved');
  } catch (err) {
    showToast('Save failed: ' + err.message);
    return;
  }

  ptoEditContext = null;
  closePtoEditor();
  renderScheduleScreen();
}

async function deletePto(id) {
  if (!confirm('Move this PTO entry to Trash? You can restore it later.')) return;
  try {
    await sb.from('pto_entries').update({ deleted_at: new Date().toISOString() }).eq('id', id);
    showToast('PTO moved to Trash');
  } catch (err) {
    showToast('Delete failed: ' + err.message);
  }
  closeDaySheet();
  renderScheduleScreen();
}

async function restorePto(id) {
  try {
    await sb.from('pto_entries').update({ deleted_at: null }).eq('id', id);
    showToast('PTO restored');
  } catch (err) {
    showToast('Restore failed: ' + err.message);
  }
  renderTrashScreen();
}

async function permanentlyDeletePto(id, storagePath) {
  if (!confirm('Permanently delete this PTO entry? This cannot be undone.')) return;
  try {
    if (storagePath) {
      await sb.storage.from('load-photos').remove([storagePath]);
    }
    await sb.from('pto_entries').delete().eq('id', id);
    showToast('PTO permanently deleted');
  } catch (err) {
    showToast('Delete failed: ' + err.message);
  }
  renderTrashScreen();
}

window.addEventListener('online', () => { updateStatusPill(); trySync(); });
window.addEventListener('offline', updateStatusPill);

(async function init() {
  await openDB();
  updateStatusPill();
  renderHome();
  if (navigator.onLine) trySync();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed', err));
  }
})();
</script>
